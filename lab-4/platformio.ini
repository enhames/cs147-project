[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_filters = send_on_enter
monitor_echo = yes
; BLE is part of the arduino-esp32 core: BLEDevice.h needs no lib_deps entry.
; BLE + Wi-Fi stacks make the sketch large; this partition gives the app 3 MB (no OTA needed in Lab 4).
board_build.partitions = huge_app.csv
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
